name: Bug 报告
description: 报告可复现的程序问题，不要附带密钥或账户数据
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除 API Key、Cookie、账户、持仓、原始服务响应和本机私人路径。
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请使用合成或脱敏数据。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 15 / Python 3.12 / v0.3.0
  - type: checkboxes
    id: secret-check
    attributes:
      label: 安全确认
      options:
        - label: 我已确认内容不含密钥、账户信息和私人行情数据。
          required: true
