name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m dragon_agent demo --out /tmp/dragon-agent-demo
      - run: python -m dragon_agent agent-architecture --out /tmp/dragon-agent-architecture.json
