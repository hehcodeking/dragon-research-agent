[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-research-agent"
version = "0.3.0"
description = "Auditable multi-agent A-share research workspace with Hithink data adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dragon-agent = "dragon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["dragon_agent*"]
